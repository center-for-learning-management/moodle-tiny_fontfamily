- name: Rebuild assets with Grunt
  if: ${{ !cancelled() }}
  run: |
    cd ${{ github.workspace }}/moodle
    set +e
    moodle-plugin-ci grunt --max-lint-warnings 0
    grunt_exit=$?
    set -e

    if [ $grunt_exit -ne 0 ] && [ $grunt_exit -ne 1 ]; then
      echo "Grunt failed with unexpected exit code $grunt_exit"
      exit $grunt_exit
    fi

    if [ -z "$(git status --porcelain public/)" ]; then
      echo "Grunt made no changes."
    else
      echo "Grunt modified files."
      : "${PLUGIN_INSTALL_DIR:?PLUGIN_INSTALL_DIR is not set - did the resolve step fail?}"
      rsync -av "${{ github.workspace }}/moodle/public/${PLUGIN_INSTALL_DIR}/." "${{ github.workspace }}/plugin/." --exclude='.git'

      cd ${{ github.workspace }}/plugin
      git add -A
      if git diff --cached --quiet; then
        echo "No plugin-relevant changes, skipping commit."
      else
        git commit -m "grunt: rebuilt AMD assets"
      fi
    fi